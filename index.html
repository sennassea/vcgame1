<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홈런 타이밍 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-wrap">
    <header class="title-area">
      <span class="ball-icon">⚾</span>
      <h1>홈런 타이밍 게임</h1>
      <span class="ball-icon">⚾</span>
    </header>

    <section class="score-board stage-score-board">
      <div class="score-item">
        <span class="label">단계</span>
        <strong><span id="stageText">1</span>단계</strong>
      </div>
      <div class="score-item">
        <span class="label">단계 점수</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-item">
        <span class="label">목표 점수</span>
        <strong id="targetScore">15</strong>
      </div>
      <div class="score-item">
        <span class="label">남은 공</span>
        <strong><span id="ballsLeft">10</span> / 10</strong>
      </div>
      <div class="score-item result-score-item">
        <span class="label">결과</span>
        <strong id="resultText">대기 중</strong>
      </div>
    </section>

    <button class="sound-button" id="soundButton" type="button">🔊 ON</button>

    <section class="field" id="field">
      <div class="sky-deco cloud cloud-a"></div>
      <div class="sky-deco cloud cloud-b"></div>
      <div class="fence"></div>
      <div class="grass-line"></div>
      <div class="diamond"></div>
      <div class="mound"></div>

      <div class="pitcher" aria-label="투수">
        <div class="pitcher-shadow"></div>
        <div class="pitcher-neck"></div>
        <div class="pitcher-head"></div>
        <div class="pitcher-cap"></div>
        <div class="pitcher-body"></div>
        <div class="pitcher-belt"></div>
        <div class="pitcher-face"></div>
        <div class="pitcher-eye"></div>
        <div class="pitcher-arm throw-arm"></div>
        <div class="pitcher-arm glove-arm"></div>
        <div class="pitcher-glove"></div>
        <div class="pitcher-leg leg-one"></div>
        <div class="pitcher-leg leg-two"></div>
      </div>

      <div class="whoosh-text" id="whooshText">슉~!</div>

      <div class="strike-zone" id="strikeZone">
        <div class="homerun-zone" id="homerunZone"></div>
      </div>

      <div class="bat-area">
        <div class="swing-arc"></div>
        <div class="bat" id="bat">
          <div class="bat-barrel"></div>
          <div class="bat-handle"></div>
          <div class="bat-knob"></div>
        </div>
      </div>

      <div class="ball" id="ball">⚾</div>
    </section>

    <section class="control-area">
      <p>스페이스바 또는 스윙 버튼을 눌러 스윙하세요!</p>
      <div class="buttons">
        <button id="startButton" type="button">게임 시작</button>
        <button id="swingButton" type="button">스윙 ⚾</button>
        <button id="pauseButton" type="button">일시정지</button>
      </div>
      <p class="rule-text">1단계는 기본 속도 · 2단계부터 공 속도 랜덤 · 3단계는 목표 점수 20점!</p>
    </section>
  </main>

  <div class="stage-modal" id="stageModal">
    <div class="stage-card">
      <div class="modal-icon" id="stageIcon">⚾</div>
      <h2 id="stageTitle">1단계 도전</h2>
      <p id="stageCondition">목표 점수 15점 이상을 달성하세요!</p>
      <div class="stage-prev-result" id="stagePrevResult">첫 단계입니다. 준비되면 시작하세요!</div>
      <button id="stageStartButton" type="button">1단계 시작</button>
    </div>
  </div>

  <div class="result-modal hidden" id="resultModal">
    <div class="modal-card" id="modalCard">
      <div class="modal-icon" id="modalIcon">🏆</div>
      <h2 id="modalTitle">승리!</h2>
      <p id="modalMessage">멋진 타격이에요!</p>
      <strong class="final-score">총점 <span id="finalScore">0</span>점</strong>

      <section class="result-summary" aria-label="타격 기록">
        <h3>⚾ 전체 타격 기록</h3>
        <div class="record-line">
          <span>헛스윙/놓침</span>
          <span><strong id="missCount">0</strong>개</span>
          <span><strong id="missScore">0</strong>점</span>
        </div>
        <div class="record-line">
          <span>안타</span>
          <span><strong id="hitCount">0</strong>개</span>
          <span><strong id="hitScore">0</strong>점</span>
        </div>
        <div class="record-line">
          <span>홈런</span>
          <span><strong id="homerunCount">0</strong>개</span>
          <span><strong id="homerunScore">0</strong>점</span>
        </div>
        <div class="record-line">
          <span>퍼펙트 홈런</span>
          <span><strong id="perfectCount">0</strong>개</span>
          <span><strong id="perfectScore">0</strong>점</span>
        </div>
      </section>

      <section class="stage-result-list" aria-label="단계별 결과">
        <h3>📋 단계별 결과</h3>
        <div id="stageResultList"></div>
      </section>

      <section class="ranking-area" aria-label="랭킹">
        <h3>🏆 TOP 10</h3>
        <div class="ranking-form">
          <input id="nicknameInput" type="text" maxlength="10" placeholder="닉네임 입력" />
          <button id="saveRankButton" type="button">기록 저장</button>
        </div>
        <ol class="ranking-list" id="rankingList"></ol>
      </section>
      <button id="restartButton" type="button">다시 하기</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
