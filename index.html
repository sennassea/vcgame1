<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>홈런 타이밍 게임</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-container">
    <h1>⚾ 홈런 타이밍 게임</h1>
    <p class="description">공이 타격존 중앙에 왔을 때 스윙하면 홈런!</p>

    <section class="score-board">
      <div>점수: <span id="score">0</span></div>
      <div>남은 공: <span id="ballsLeft">10</span></div>
      <div>결과: <span id="resultText">대기 중</span></div>
    </section>

    <section class="field" id="field">
      <div class="pitcher">🤾‍♂️</div>
      <div class="hit-zone">
        <div class="home-run-zone"></div>
      </div>
      <div class="batter-area">
        <div class="aluminum-bat"></div>
      </div>
      <div class="ball" id="ball">⚾</div>
    </section>

    <section class="controls">
      <button id="startButton">게임 시작</button>
      <button id="swingButton">스윙!</button>
    </section>

    <p class="guide">
      조작: <strong>스페이스바</strong> 또는 <strong>스윙 버튼</strong><br />
      안타: 1점 / 홈런: 2점 / 10점 이상이면 승리
    </p>
  </main>

  <div class="result-modal hidden" id="resultModal">
    <div class="modal-card" id="modalCard">
      <p class="modal-emoji" id="modalEmoji">🏆</p>
      <h2 id="modalTitle">승리!</h2>
      <p id="modalMessage">결과 메시지</p>
      <button id="restartButton">다시 시작</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
